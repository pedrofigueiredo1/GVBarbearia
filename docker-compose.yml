services:
  postgres:
    image: postgres:16-alpine
    container_name: gvbarbearia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gvbarbearia
      POSTGRES_PASSWORD: gvbarbearia
      POSTGRES_DB: gvbarbearia
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
